<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hermes{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Hermes</a>
    <nav>{% block nav %}{% endblock %}</nav>
    <span class="whoami" title="{{ request.state.user.login }}">{{ request.state.user.first_name }}'s library</span>
  </header>
  <main class="page">{% block body %}{% endblock %}</main>
  <script src="/static/app.js"></script>
</body>
</html>
