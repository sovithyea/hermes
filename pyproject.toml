[project]
name = "hermes"
version = "0.1.0"
description = "Turn books into full-cast audiobooks with local AI voices"
readme = "README.md"
authors = [
    { name = "Vithyea", email = "prachsovithyea11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "kokoro>=0.9.4",
    "numpy>=2.5.3",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "pydub>=0.25.1",
    "pypdf>=6.19.0",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
    "typer>=0.27.2",
]

[project.scripts]
hermes = "hermes.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
